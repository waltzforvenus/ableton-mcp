# Release build for the telemetry-free ableton-mcp fork.
#
# Pushing a tag like v1.9.0 runs the full suite, builds the wheel and sdist,
# and attaches them to a GitHub Release for that tag — the "publish" step of
# docs/UPSTREAM.md §5. The only upload target is GitHub itself; nothing else
# receives anything.

name: Release

on:
  push:
    tags:
      - "v*"
  # Manual escape hatch: environments whose git credentials can push
  # branches but not tag refs can still release — dispatch with the tag
  # name and the release action creates the tag at the dispatched commit.
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to create the release under (e.g. v1.4.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --extra dev

      # export_audio / bounce_track verify the rendered file with ffmpeg and
      # ffprobe (Homebrew on the Mac this runs against); without them the
      # render tests report ok=false and CI has been red since PR #26.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Run tests (no Ableton, no network)
        run: uv run pytest

      - name: Build package
        run: uv build

      - name: Create GitHub Release with the build attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          # Not dist/*: uv build drops a 1-byte .gitignore into dist/, and a
          # bare glob sweeps it into the release assets (it did, on v1.4.0).
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
