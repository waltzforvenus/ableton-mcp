[project]
name = "ableton-mcp"
version = "1.7.0"
description = "Ableton Live integration through the Model Context Protocol — telemetry-free fork"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["ableton", "live", "mcp", "model-context-protocol", "music", "midi", "daw"]
authors = [
    {name = "waltzforvenus", email = "mert@xn--rs-eka.net"}
]
# Fork changes are dual-licensed GPLv3/AGPLv3 (recipient's choice); upstream
# code stays MIT and its notice must be retained. See LICENSE.
license = "(GPL-3.0-or-later OR AGPL-3.0-or-later) AND MIT"
license-files = ["LICENSE", "LICENSE.MIT", "LICENSE.GPL-3.0", "LICENSE.AGPL-3.0"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp[cli]>=1.9.0,<2.0.0",
]

[project.optional-dependencies]
# Warp vision (analyze_clip_audio / suggest_warp_markers): read the clip's
# audio file in THIS process and render a spectrogram the model can look at.
# Kept deliberately small and network-free — numpy (BSD-3), soundfile
# (BSD-3, wraps libsndfile LGPL-2.1, dynamically linked) and Pillow
# (MIT-CMU/HPND), all GPL/AGPL-compatible. librosa was rejected: it drags in
# numba/scipy/scikit-learn and pooch, an HTTP client that downloads example
# data, which the no-telemetry rule forbids.
analysis = [
    "numpy>=1.24",
    "soundfile>=0.12",
    "pillow>=10.0",
]
dev = [
    "pytest>=8.0",
    "ableton-mcp[analysis]",
]

[project.scripts]
ableton-mcp = "ableton_mcp.app:main"
ableton-mcp-install-script = "ableton_mcp.remote_script_install:main"

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["ableton_mcp", "ableton_mcp.bundled_ableton_remote_script"]

[tool.setuptools.package-data]
"ableton_mcp.bundled_ableton_remote_script" = ["remote_script_init.py"]

[project.urls]
"Homepage" = "https://github.com/waltzforvenus/ableton-mcp"
"Bug Tracker" = "https://github.com/waltzforvenus/ableton-mcp/issues"
"Upstream" = "https://github.com/ahujasid/ableton-mcp"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
